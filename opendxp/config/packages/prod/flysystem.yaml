services:
    app.s3_client:
        class: Aws\S3\S3Client
        arguments:
            -
                endpoint: '%env(resolve:S3_DOMAIN)%'
                use_path_style_endpoint: true
                region: '%env(S3_REGION)%'
                version: 'latest'
                credentials:
                    key: '%env(S3_ACCESS_KEY_ID)%'
                    secret: '%env(S3_SECRET_ACCESS_KEY)%'

flysystem:
    storages:
        opendxp.asset.storage:
            adapter: aws_s3
            visibility: public
            public_url: '%env(S3_CDN_DOMAIN)%'
            options:
                client: 'app.s3_client'
                bucket: '%env(S3_BUCKET_PUBLIC)%'
                prefix: '%env(S3_ROOT_PREFIX)%public'

        opendxp.thumbnail.storage:
            adapter: aws_s3
            visibility: public
            public_url: '%env(S3_CDN_DOMAIN)%'
            options:
                client: 'app.s3_client'
                bucket: '%env(S3_BUCKET_PUBLIC)%'
                prefix: '%env(S3_ROOT_PREFIX)%public'

        opendxp.version.storage:
            adapter: aws_s3
            visibility: private
            options:
                client: 'app.s3_client'
                bucket: '%env(S3_BUCKET_PRIVATE)%'
                prefix: '%env(S3_ROOT_PREFIX)%private'
